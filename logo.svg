<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545" />
      <stop offset="60%" stop-color="#133a68" />
      <stop offset="100%" stop-color="#008000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Shield -->
  <path d="M 50,5 L 88,20 C 88,60 50,92 50,92 C 50,92 12,60 12,20 Z" 
        fill="url(#shieldGrad)" 
        stroke="#ffffff" 
        stroke-width="2.5" 
        filter="url(#dropShadow)" />

  <!-- Inner Gold Border -->
  <path d="M 50,11 L 82,23 C 82,56 50,84 50,84 C 50,84 18,56 18,23 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="1.8" 
        opacity="0.85" />

  <!-- Central Gateway / Dwaar Arch -->
  <!-- Outer Arch Pillars -->
  <path d="M 33,68 L 33,38 Q 50,22 67,38 L 67,68 L 60,68 L 60,42 Q 50,30 40,42 L 40,68 Z" 
        fill="#ffffff" />

  <!-- Inner Gateway Doors (Dwaar) -->
  <path d="M 43,68 L 43,45 Q 50,39 57,45 L 57,68 Z" 
        fill="#00d2d3" 
        opacity="0.3" />

  <!-- Gateway Apex Crest (Sun / Star of Success) -->
  <circle cx="50" cy="27" r="4.5" fill="#f6d365" />
  <path d="M 50,19 L 50,35 M 42,27 L 58,27" stroke="#f6d365" stroke-width="1.5" stroke-linecap="round" />

  <!-- Door Grid Lines -->
  <line x1="50" y1="42" x2="50" y2="68" stroke="#ffffff" stroke-width="1.5" />
  <line x1="43" y1="55" x2="57" y2="55" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Foundation Base -->
  <rect x="28" y="68" width="44" height="4" rx="1.5" fill="#ffffff" />
</svg>
